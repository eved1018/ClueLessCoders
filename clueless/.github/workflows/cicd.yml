name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build, Test, and Run Integration Tests
    runs-on: ubuntu-latest

    steps:
    # Checkout the code
    - name: Checkout code
      uses: actions/checkout@v3

    # Set up Java
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'

    # Build the project
    - name: Build with Maven
      run: mvn --no-transfer-progress clean package

    # Run unit tests
    - name: Run Unit Tests
      run: mvn --no-transfer-progress test

    # Run integration tests
    - name: Run Integration Tests
      run: mvn --no-transfer-progress verify -Pintegration-tests

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build

    steps:
    # Checkout the code
    - name: Checkout code
      uses: actions/checkout@v3

    # Log in to DockerHub
    - name: Log in to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Build Docker image
    - name: Build Docker Image
      run: docker build -t clueless-server:latest .

    # Push Docker image to DockerHub
    - name: Push Docker Image
      run: docker tag clueless-server:latest ${{ secrets.DOCKER_USERNAME }}/clueless-server:latest && docker push ${{ secrets.DOCKER_USERNAME }}/clueless-server:latest

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'

    steps:
    # Deploy the Docker container
    - name: SSH and Deploy
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/clueless-server:latest
          docker stop clueless-server || true
          docker rm clueless-server || true
          docker run -d -p 3834:3834 --name clueless-server ${{ secrets.DOCKER_USERNAME }}/clueless-server:latest server